    <style>
        body {

        }

        .bg-executive {

            background-image: radial-gradient(circle at 100% 0%, rgba(217, 227, 244, 0.4) 0%, transparent 50%),

        }

            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(225, 227, 228, 0.6);

<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-executive text-on-surface">
    <div class="glass-card p-10 sm:p-16 md:p-20 rounded-xl max-w-[800px] w-full text-center relative overflow-hidden">
        <!-- Subtle pattern in card corners -->
        <div
            class="absolute top-0 right-0 w-32 h-32 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMCwwLDAsMC4wMykiLz48L3N2Zz4=')] opacity-50 rounded-bl-full">
        </div>
        <div
            class="absolute bottom-0 left-0 w-32 h-32 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMCwwLDAsMC4wMykiLz48L3N2Zz4=')] opacity-50 rounded-tr-full">
        </div>
        <!-- Logo -->
        <div class="relative z-10">
            <img alt="Business Check-up" class="w-56 sm:w-72 h-auto mx-auto mb-16"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzIFuYOG6GyKqNXhF2PN5lfK6ZOYAaAaXr1fqHb5JecLzDZrc_2P8A1Zy053rOQYKFv0xL6EpPBfsDD_eB3n8rvohEUcqam_rNxFRmajMJ_saUfw1a8BDqHsQmNLmcj62ztkk6us0YPsa8QIDceq_Mhl6bU10ralfjsHtsm_5pNu89FpUKsVNob5aoBjoJhbw9fkf8oeNrjCq7xtEZI-vVowBdKI7XDTEABWwbTaNKdY3zlL1nxiZeJZ476Sd9YAtM4AdjLfwebb-0" />
        </div>
        <!-- Texte explicatif -->
        <div class="relative z-10 mb-16 sm:mb-20">
            <h1 class="text-headline-display text-primary mb-8 tracking-tight">Lancement imminent</h1>
            <p class="text-body-lg text-on-surface-variant max-w-[600px] mx-auto leading-relaxed tracking-wide">
                Dans le cadre de l'événement organisé par la <strong class="font-semibold text-primary">Chambre de
                    Commerce et d'Industrie du Bénin
                    (CCIB)</strong>, la plateforme ouvrira officiellement ses portes à la fin de ce
                décompte.<br /><br />
                <span class="text-body-md text-outline">Merci de votre patience.</span>
            </p>
        </div>
        <!-- Compte à rebours -->
        <div class="relative z-10 grid grid-cols-4 gap-4 sm:gap-6 md:gap-10 justify-items-center max-w-[600px] mx-auto"
            id="countdown-timer">
            <div class="flex flex-col items-center w-full">
                <div
                    class="bg-surface border border-outline-variant/30 rounded-lg w-full py-6 sm:py-8 flex items-center justify-center shadow-sm">
                    <span class="text-4xl sm:text-5xl md:text-6xl font-bold text-primary font-['Inter']"
                        id="days">00</span>
                </div>
                <span class="text-label-sm text-on-surface-variant mt-4 uppercase tracking-[0.15em]">Jours</span>
            </div>
            <div class="flex flex-col items-center w-full">
                <div
                    class="bg-surface border border-outline-variant/30 rounded-lg w-full py-6 sm:py-8 flex items-center justify-center shadow-sm">
                    <span class="text-4xl sm:text-5xl md:text-6xl font-bold text-primary font-['Inter']"
                        id="hours">00</span>
                </div>
                <span class="text-label-sm text-on-surface-variant mt-4 uppercase tracking-[0.15em]">Heures</span>
            </div>
            <div class="flex flex-col items-center w-full">
                <div
                    class="bg-surface border border-outline-variant/30 rounded-lg w-full py-6 sm:py-8 flex items-center justify-center shadow-sm">
                    <span class="text-4xl sm:text-5xl md:text-6xl font-bold text-primary font-['Inter']"
                        id="minutes">00</span>
                </div>
                <span class="text-label-sm text-on-surface-variant mt-4 uppercase tracking-[0.15em]">Minutes</span>
            </div>
            <div class="flex flex-col items-center w-full">
                <div
                    class="bg-surface border border-outline-variant/30 rounded-lg w-full py-6 sm:py-8 flex items-center justify-center shadow-sm">
                    <span class="text-4xl sm:text-5xl md:text-6xl font-bold text-secondary font-['Inter']"
                        id="seconds">00</span>
                </div>
                <span class="text-label-sm text-on-surface-variant mt-4 uppercase tracking-[0.15em]">Secs</span>
            </div>
        </div>
    </div>
    <script>
        // Date cible : 27 Juillet 2026 à 00:00:00 (Fuseau +01:00)
        const targetDateString = "2026-07-27T00:00:00+01:00";
        const targetDate = new Date(targetDateString).getTime();

        const countdownInterval = setInterval(function () {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown-timer").innerHTML =
                    "<div class='col-span-4 py-8'><h2 class='text-headline-md text-secondary m-0 font-medium'>La plateforme est maintenant accessible.</h2></div>";
                return;
            }

            // Calcul du temps restant
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Mise à jour du DOM avec formatage
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

        }, 1000);
    </script>
